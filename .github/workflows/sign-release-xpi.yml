name: Sign and publish XPI (main)

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'background.js'
      - 'popup.html'
      - 'popup.js'
      - 'icon.svg'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine version
        id: vars
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify AMO credentials are present
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "::error::AMO_API_KEY and/or AMO_API_SECRET resolved empty. Check that both are set as secrets on the 'main' environment (Settings -> Environments -> main) and that the values were actually saved."
            exit 1
          fi

      - name: Sign and submit to AMO (unlisted)
        run: |
          npx --yes web-ext@latest sign \
            --source-dir . \
            --artifacts-dir ./web-ext-artifacts \
            --channel unlisted \
            --api-key "${{ secrets.AMO_API_KEY }}" \
            --api-secret "${{ secrets.AMO_API_SECRET }}" \
            --ignore-files 'README.md' '.gitignore' '.github/**'

      - name: Package as stable release asset
        run: |
          XPI_FILE=$(ls web-ext-artifacts/*.xpi | head -n1)
          mv "$XPI_FILE" web-ext-artifacts/usage-badge-claude-ai.xpi

      - name: Upload signed XPI as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: usage-badge-claude-ai-${{ steps.vars.outputs.version }}-signed
          path: web-ext-artifacts/usage-badge-claude-ai.xpi
          retention-days: 30
          if-no-files-found: error

      - name: Create or update stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="stable"
          XPI_PATH="web-ext-artifacts/usage-badge-claude-ai.xpi"
          NOTES="Signed build from \`main\` at commit ${GITHUB_SHA} (manifest version ${{ steps.vars.outputs.version }}), submitted to AMO on the unlisted channel.

          This asset's URL never changes — it always points to the latest signed build, so it can be used as a permanent \`install_url\` for Firefox Enterprise Policies (\`policies.json\` / \`programs.firefox.policies.ExtensionSettings\`)."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XPI_PATH" --clobber
            gh release edit "$TAG" \
              --title "v${{ steps.vars.outputs.version }} (stable)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$XPI_PATH" \
              --title "v${{ steps.vars.outputs.version }} (stable)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
